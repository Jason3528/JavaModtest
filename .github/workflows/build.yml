name: build
on: [ push, workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 21 runs Gradle; 8 is what the 1.12.2 toolchain compiles/runs with
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
